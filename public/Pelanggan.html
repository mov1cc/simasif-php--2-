<!-- KONTEN -->
<main id="main" class="min-h-screen p-5 sm:p-8">
  <h1 class="text-2xl sm:text-3xl font-bold">Data Pelanggan Studio</h1>
  <p class="text-sm sm:text-base text-gray-800 mt-1">Pelanggan otomatis tercatat saat booking, atau bisa ditambahkan manual.</p>

  <section id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6"></section>

  <section class="mt-5 flex flex-col lg:flex-row lg:items-center gap-3">
    <div class="flex-1 bg-white rounded-xl shadow-md border border-gray-200 p-3 flex flex-col sm:flex-row sm:items-center gap-3">
      <label class="flex-1 flex items-center gap-2 bg-[#EDEDED] border border-gray-300 rounded-md px-3 py-2">
        <i class="fa-solid fa-magnifying-glass text-gray-700"></i>
        <input id="search" type="text" placeholder="Cari nama Pelanggan atau Nomor Telepon" oninput="q=this.value; page=1; renderTable()" class="bg-transparent w-full text-xs focus:outline-none">
      </label>
      <div class="relative sm:w-52">
        <select id="cat" onchange="cat=this.value; page=1; renderTable()" class="appearance-none w-full bg-[#D1D1D1] text-black text-[11px] font-semibold pl-3 pr-8 py-2 rounded-sm shadow focus:outline-none cursor-pointer">
          <option value="semua">Semua Kategori</option>
          <optgroup label="Status Pelanggan">
            <option value="Baru">Baru</option>
            <option value="Aktif">Aktif</option>
            <option value="Tetap">Tetap</option>
          </optgroup>
          <optgroup label="Pemesanan">
            <option value="pemesanan-aktif">Pemesanan Aktif</option>
            <option value="pemesanan-nonaktif">Pemesanan Non Aktif</option>
          </optgroup>
        </select>
        <i class="fa-solid fa-chevron-down text-black text-[10px] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>
    </div>
    <a href="FormTambahPelanggan.html" class="bg-black text-white text-[11px] font-bold px-8 py-2 rounded-full shadow flex items-center justify-center gap-2 lg:self-center hover:bg-gray-800"><i class="fa-solid fa-plus"></i> Tambah Pelanggan</a>
  </section>

  <section class="mt-6 overflow-x-auto pb-2">
    <div class="min-w-[780px]">
      <div id="thead" class="grid grid-cols-[2.6fr_1.5fr_1fr_1fr_1.3fr_1.1fr] items-center gap-2 bg-[#0A4DFF] text-white font-bold rounded-xl px-4 py-3 text-center shadow-md"></div>
      <div id="rows" class="mt-3 flex flex-col gap-2.5"></div>
    </div>
  </section>

  <nav id="pager" class="mt-5 flex items-center justify-center gap-3"></nav>
</main>



<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-[60]"></div>

<script>
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
let customers = [], q = '', cat = 'semua', sort = 'terbaru', page = 1;
const PER = 10;

async function api(url, opt = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'HTTP ' + res.status); e.status = res.status; e.data = data; throw e; }
  return data;
}
const toCust = c => ({ ...c, terdaftar: new Date(c.terdaftar) });
async function loadCustomers() {
  try { customers = (await api('/api/pelanggan')).data.map(toCust); }
  catch (e) { toast('Gagal memuat pelanggan: ' + e.message); }
  refresh();
}

/* ====== HELPER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
// Baru = pemesanan < 5, Aktif = pemesanan 5-6, Tetap = pemesanan >= 7
const MIN_AKTIF = 5, MIN_TETAP = 7, HARI_BARU = 7;
const statusOf = c => c.pemesanan >= MIN_TETAP ? 'Tetap' : c.pemesanan >= MIN_AKTIF ? 'Aktif' : 'Baru';
// Edit & hapus hanya boleh jika tidak ada pemesanan yang sedang berjalan/diproses
const isLocked = c => c.berjalan > 0;
// Cocokkan pelanggan dengan kategori terpilih (status, atau ada/tidaknya pemesanan berjalan)
const matchCat = c =>
  cat === 'semua' ? true
  : cat === 'pemesanan-aktif' ? c.berjalan > 0
  : cat === 'pemesanan-nonaktif' ? c.berjalan === 0
  : statusOf(c) === cat;
const COLOR = { Aktif: '#7FA8FF', Baru: '#00C800', Tetap: '#FF8A8A' };
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}

/* ====== STATISTIK ====== */
function renderStats() {
  const sc = (icon, title, sub, l, r) => `
    <div class="bg-white rounded-xl border-2 border-[#FFE600] shadow-md overflow-hidden flex flex-col">
      <div class="relative p-4 pt-9 flex-1"><i class="${icon} absolute top-3 right-4 text-xl"></i>
        <div class="text-xl font-bold leading-tight">${title}</div><div class="text-[11px]">${sub}</div></div>
      <div class="bg-[#FFE600] px-4 py-2 flex justify-between gap-2 text-[11px] font-medium"><span>${l}</span><span class="text-right">${r}</span></div>
    </div>`;
  const total = customers.length;
  const aktif = customers.filter(c => c.berjalan > 0).length;   // pelanggan dengan pemesanan aktif (sedang berjalan/diproses)
  const baruAll = customers.filter(c => statusOf(c) === 'Baru');
  const baruMinggu = baruAll.filter(c => (TODAY - c.terdaftar) / 86400000 < HARI_BARU).length;   // status Baru & terdaftar dalam 7 hari terakhir
  const top = customers.reduce((a, c) => (!a || c.pemesanan > a.pemesanan ? c : a), null);
  $('stats').innerHTML =
    sc('fa-solid fa-user-check', `${aktif} Pelanggan Aktif`, 'Total Pelanggan dengan pemesanan Aktif', 'Keseluruhan Pelanggan', `${total} Pelanggan`) +
    sc('fa-solid fa-ranking-star', top ? esc(top.nama) : '-', 'Pelanggan dengan Pemesanan Terbanyak', 'Total Pemesanan', top ? `${top.pemesanan} Pemesanan Aktif` : '-') +
    sc('fa-solid fa-user-plus', `${baruMinggu} Pelanggan Baru`, 'Total Pelanggan Baru Minggu Ini', 'Total Pelanggan Baru', `${baruAll.length} Pelanggan`);
}

/* ====== TABEL ====== */
function renderHead() {
  const ico = sort === 'za' ? 'fa-arrow-down-z-a' : 'fa-arrow-down-a-z';
  const tip = sort === 'az' ? 'Urutkan Z-A' : 'Urutkan A-Z';
  $('thead').innerHTML = `
    <div class="flex items-center"><button type="button" onclick="cycleSort()" title="${tip}" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white/20 ${sort === 'terbaru' ? '' : 'bg-white/20'}"><i class="fa-solid ${ico}"></i></button><span class="flex-1">Nama</span></div>
    <div>Nomor</div><div>Pemesanan</div><div>Status</div><div>Terdaftar</div><div>Aksi</div>`;
}
// dua kondisi: A-Z dan Z-A (urutan awal = terbaru, sampai ikon diklik)
function cycleSort() { sort = sort === 'az' ? 'za' : 'az'; renderTable(); }

function filtered() {
  const term = q.trim().toLowerCase(), digits = term.replace(/\D/g, '');
  let rows = customers.filter(c =>
    matchCat(c) &&
    (!term || c.nama.toLowerCase().includes(term) || (digits && c.nomor.includes(digits))));
  if (sort === 'terbaru') rows.sort((a, b) => b.terdaftar - a.terdaftar);
  else rows.sort((a, b) => a.nama.localeCompare(b.nama, 'id') * (sort === 'az' ? 1 : -1));
  return rows;
}

function row(c) {
  const st = statusOf(c), lock = isLocked(c);
  const lockTip = 'Tidak bisa diubah/dihapus karena masih ada pemesanan yang sedang berjalan atau diproses';
  return `<div class="grid grid-cols-[2.6fr_1.5fr_1fr_1fr_1.3fr_1.1fr] items-center gap-2 bg-white rounded-lg border border-gray-200 shadow-md px-4 py-2.5 text-sm font-semibold text-center">
    <div class="flex items-center gap-4 min-w-0 text-left">
      <span class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:${COLOR[st]}">${esc(c.nama.charAt(0).toUpperCase())}</span>
      <span class="truncate" title="${esc(c.nama)}">${esc(c.nama)}</span></div>
    <div>${esc(c.nomor)}</div>
    <div><span class="inline-block min-w-[3.5rem] px-3 py-1 rounded-md font-bold shadow ${c.pemesanan ? 'bg-[#00D100]' : 'bg-white border border-gray-200'}">${c.pemesanan}</span></div>
    <div class="flex items-center justify-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${COLOR[st]}"></span>${st}</div>
    <div>${fmtDate(c.terdaftar)}</div>
    <div class="flex items-center justify-center gap-2">
      <button type="button" ${lock ? `disabled title="${lockTip}"` : `onclick="location.href='FormTambahPelanggan.html?id=${encodeURIComponent(c.id)}'" title="Edit"`} class="w-9 h-9 rounded-full text-white flex items-center justify-center shadow ${lock ? 'bg-[#808080] opacity-60 cursor-not-allowed' : 'bg-black hover:bg-gray-800'}"><i class="fa-solid fa-pen"></i></button>
      <button type="button" ${lock ? `disabled title="${lockTip}"` : `onclick="delCustomer('${c.id}')" title="Hapus"`} class="w-9 h-9 rounded-full text-white flex items-center justify-center shadow ${lock ? 'bg-[#FF8A8A] opacity-70 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700'}"><i class="fa-solid fa-trash-can"></i></button>
    </div></div>`;
}

function renderTable() {
  renderHead();
  const all = filtered(), pages = Math.max(1, Math.ceil(all.length / PER));
  page = Math.min(Math.max(page, 1), pages);
  const rows = all.slice((page - 1) * PER, page * PER);
  $('rows').innerHTML = rows.length ? rows.map(row).join('')
    : '<p class="text-sm text-gray-500 text-center py-10">Tidak ada pelanggan yang cocok.</p>';
  renderPager(pages);
}
function renderPager(pages) {
  const nav = 'w-9 h-9 rounded-full bg-white text-black border border-gray-200 flex items-center justify-center shadow-md disabled:opacity-40 disabled:cursor-not-allowed';
  let nums = '';
  for (let i = 1; i <= pages; i++)
    nums += `<button type="button" onclick="goPage(${i})" class="w-7 h-7 rounded-full text-sm font-bold ${i === page ? 'bg-[#FFE600]' : ''} text-black">${i}</button>`;
  $('pager').innerHTML = `
    <button type="button" class="${nav}" ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})" title="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="bg-white border border-gray-200 rounded-full px-1.5 py-1 flex items-center gap-1 shadow-md">${nums}</div>
    <button type="button" class="${nav}" ${page >= pages ? 'disabled' : ''} onclick="goPage(${page + 1})" title="Berikutnya"><i class="fa-solid fa-chevron-right"></i></button>`;
}
function goPage(p) { page = p; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }); }


async function delCustomer(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;
  if (isLocked(c)) return toast('Pelanggan masih punya pemesanan yang sedang berjalan.');
  if (!confirm(`Hapus pelanggan "${c.nama}"?`)) return;
  try { await api('/api/pelanggan/' + encodeURIComponent(id), { method: 'DELETE' }); }
  catch (err) { return toast('Gagal menghapus: ' + err.message); }
  customers = customers.filter(x => x.id !== id);
  refresh(); toast('Pelanggan dihapus.');
}
function refresh() { renderStats(); renderTable(); }

/* ====== SIDEBAR ====== */

const toggleSb = () => {
    const html = document.documentElement;
    const body = document.body;

    html.classList.toggle('sb-hidden');
    body.classList.toggle('sb-hidden');

    const isHidden = html.classList.contains('sb-hidden');

    localStorage.setItem('sidebarHidden', isHidden);
};


// Saat halaman dibuka, ambil kondisi terakhir
document.addEventListener("DOMContentLoaded", () => {

    const isHidden = localStorage.getItem('sidebarHidden');

    if (isHidden === 'true') {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');
    }

    if (window.innerWidth < 1024 && isHidden === null) {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');

        localStorage.setItem('sidebarHidden', 'true');
    }

});

loadCustomers();
</script>
