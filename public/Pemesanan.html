<!-- KONTEN -->
<main id="main" class="min-h-screen p-5 sm:p-8">
  <h1 class="text-2xl sm:text-3xl font-bold">Data Pemesanan Pelanggan</h1>
  <p class="text-sm sm:text-base text-gray-800 mt-1">Semua pemesanan yang masuk dari pelanggan.</p>

  <section id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6"></section>

  <section class="mt-5 bg-white rounded-xl shadow-md border border-gray-200 p-3 flex flex-col lg:flex-row lg:items-center gap-3">
    <label class="flex-1 flex items-center gap-2 bg-[#EDEDED] border border-gray-300 rounded-md px-3 py-2">
      <i class="fa-solid fa-magnifying-glass text-gray-700"></i>
      <input id="search" type="text" placeholder="Cari nama, kode, atau nomor telepon" oninput="q=this.value; page=1; renderTable()" class="bg-transparent w-full text-xs focus:outline-none">
    </label>
    <div class="relative lg:w-56">
      <select id="statusF" onchange="stat=this.value; page=1; renderTable()" class="appearance-none w-full bg-[#D1D1D1] text-black text-[11px] font-semibold pl-3 pr-8 py-2 rounded-sm shadow focus:outline-none cursor-pointer"></select>
      <i class="fa-solid fa-chevron-down text-black text-[10px] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
    </div>
    <div class="relative lg:w-56">
        <select id="payF" onchange="pay=this.value; page=1; renderTable()" class="appearance-none w-full bg-[#D1D1D1] text-black text-[11px] font-semibold pl-3 pr-8 py-2 rounded-sm shadow focus:outline-none cursor-pointer"></select>
        <i class="fa-solid fa-chevron-down text-black text-[10px] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
    </div>
    <div class="relative lg:w-44 bg-black text-white text-[11px] font-semibold rounded-sm shadow flex items-center justify-between pl-3 pr-3 py-2">
      <span id="dateText">DD/MM/YY</span>
      <span class="flex items-center gap-2">
        <button id="dateClear" type="button" onclick="clearDate()" title="Hapus filter tanggal" class="hidden relative z-10 hover:opacity-70"><i class="fa-solid fa-xmark"></i></button>
        <i class="fa-regular fa-calendar-check"></i>
      </span>
      <input id="dateF" type="date" aria-label="Filter tanggal jadwal" onclick="try{this.showPicker()}catch(e){}" onchange="setDate(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
    </div>
  </section>

  <section class="mt-6 overflow-x-auto pb-2">
    <div class="min-w-[1000px]">
      <div id="thead" class="grid grid-cols-[2.4fr_1.2fr_1.1fr_1.7fr_1.5fr_1fr_1fr] items-center gap-2 bg-[#0A4DFF] text-white font-bold rounded-xl px-4 py-1.5 text-center shadow-md"></div>
      <div id="rows" class="mt-3 flex flex-col gap-2.5"></div>
    </div>
  </section>

  <nav id="pager" class="mt-5 flex items-center justify-center gap-3"></nav>
</main>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
/* ====== KONFIGURASI ====== */
// Isi rute halaman detail pemesanan. Kosong = tampil pesan "belum tersambung".
const ROUTES = { detail: '' };

/* ====== DATA CONTOH (ganti dengan hasil GET /api/pemesanan) ====== */
const dt = (m, d) => new Date(2026, m - 1, d, 10, 0);
// [pelanggan, kode, jadwal, status pemesanan, status pembayaran, total]
const RAW = [
  ['Ayu Wardatul Widad', 'SF-3XWYZK', dt(11, 12), 'Pemesanan Dibuat', 'Belum Dibayar', 70000],
  ['Ibrahim Movic', 'SF-2KWYZK', dt(11, 13), 'Pembayaran Diverifikasi', 'Ditolak', 30000],
  ['Yogi Darmawangsah', 'CK-3WWYZK', dt(11, 14), 'Menunggu Pembayaran', 'Lunas', 130000],
  ['M Rayyan Abie', 'SC-1XYYZX', dt(11, 15), 'Terjadwal', 'Menunggu Verifikasi', 120000],
  ['Rivaldo Aditya Putra', 'FS-2KWZYX', dt(11, 16), 'Sesi Foto', 'Belum Dibayar', 70000],
  ['Riska Putri', 'SF-3XWWZZ', dt(11, 17), 'Proses Editing', 'Belum Dibayar', 50000],
  ['Cika Larasati', 'ED-3XXYYK', dt(11, 18), 'Hasil Siap', 'Belum Dibayar', 70000],
  ['Nafis Yulianto', 'SF-3XXXXK', dt(11, 19), 'Selesai', 'Belum Dibayar', 30000],
  ['Rara Rucika', 'FS-2YYYZK', dt(11, 21), 'Pemesanan Dibuat', 'Belum Dibayar', 70000],
  ['Smith', 'CK-2WWWK', dt(11, 20), 'Pemesanan Dibuat', 'Belum Dibayar', 80000],
  ['Dewi Lestari', 'SF-1AXBZK', dt(11, 2), 'Selesai', 'Lunas', 70000],
  ['Bagus Santoso', 'FS-4KLMNZ', dt(11, 3), 'Selesai', 'Lunas', 120000],
  ['Putri Ayu Ningrum', 'CK-2PQRST', dt(11, 4), 'Selesai', 'Lunas', 30000],
  ['Fajar Nugroho', 'SC-3ABCDE', dt(11, 5), 'Selesai', 'Lunas', 20000],
  ['Salsa Maharani', 'ED-5FGHIJ', dt(11, 6), 'Selesai', 'Lunas', 25000],
  ['Dimas Prakoso', 'SF-6KLMNO', dt(11, 7), 'Selesai', 'Lunas', 70000],
  ['Nabila Zahra', 'FS-7PQRSU', dt(11, 8), 'Hasil Siap', 'Lunas', 120000],
  ['Agus Hermawan', 'PF-8TUVWX', dt(11, 9), 'Menunggu Pembayaran', 'Belum Dibayar', 30000],
  ['Intan Permata', 'CK-9YZABC', dt(11, 10), 'Menunggu Pembayaran', 'Belum Dibayar', 60000],
  ['Hendra Wijaya', 'SF-1DEFGH', dt(11, 11), 'Menunggu Pembayaran', 'Belum Dibayar', 70000]
];

let orders = RAW.map(([nama, kode, jadwal, status, bayar, total], i) => ({
  id: 'o' + (i + 1), nama, kode, jadwal, status, bayar, total, ci: i,
  nomor: i === 0 ? '08123456789' : '0812' + (3450000 + i * 7919)
}));
let q = '', stat = 'semua', pay = 'semua', dateStr = '', sort = 'default', page = 1;
const PER = 10;

/* ====== HELPER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtTime = d => `${pad(d.getHours())} : ${pad(d.getMinutes())} WIB`;
const money = n => 'Rp' + Number(n).toLocaleString('id-ID');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const AV = ['#7FA8FF', '#FF8A8A', '#00C800'];   // warna avatar bergantian biru, merah muda, hijau
const STATUS = {
  'Pemesanan Dibuat': '#D9D9D9', 'Menunggu Pembayaran': '#FFE033', 'Pembayaran Diverifikasi': '#6A9BFF', 'Terjadwal': '#F27CF2',
  'Sesi Foto': '#FFB27A', 'Proses Editing': '#7BF0FF', 'Hasil Siap': '#B388FF', 'Selesai': '#86F286'
};
const BAYAR = { 'Belum Dibayar': '#C4C4C4', 'Menunggu Verifikasi': '#FFE033', 'Lunas': '#8EF08E', 'Ditolak': '#FF8A8A' };
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}
function go(key, id) {
  const url = ROUTES[key];
  if (!url) return toast('Halaman ini belum tersambung.');
  location.href = url + (id ? '?id=' + encodeURIComponent(id) : '');
}

/* ====== STATISTIK ====== */
function renderStats() {
  const sc = (icon, title, sub, l, r) => `
    <div class="bg-white rounded-xl border-2 border-[#FFE600] shadow-md overflow-hidden flex flex-col">
      <div class="relative p-4 pt-9 flex-1"><span class="absolute top-3 right-4 text-xl leading-none">${icon}</span>
        <div class="text-2xl font-bold leading-tight">${title}</div><div class="text-[13px]">${sub}</div></div>
      <div class="bg-[#FFE600] px-4 py-2 flex justify-between gap-2 text-[11px] font-medium"><span>${l}</span><span class="text-right">${r}</span></div>
    </div>`;
  const dayMs = 86400000, ws = new Date(TODAY); ws.setDate(ws.getDate() - ((TODAY.getDay() + 6) % 7));   // awal minggu (Senin)
  const selesai = orders.filter(o => o.status === 'Selesai').length;
  const verif = orders.filter(o => o.bayar === 'Lunas').length;   // pembayaran sudah diverifikasi (lunas)
  const hariIni = orders.filter(o => ymd(o.jadwal) === ymd(TODAY)).length;
  const mingguIni = orders.filter(o => o.jadwal >= ws && o.jadwal < new Date(ws.getTime() + 7 * dayMs)).length;
  const menunggu = orders.filter(o => o.status === 'Menunggu Pembayaran').length;
  const badge = '<span class="relative inline-block"><i class="fa-solid fa-certificate"></i><i class="fa-solid fa-check text-white absolute inset-0 flex items-center justify-center text-[10px]"></i></span>';
  $('stats').innerHTML =
    sc('<i class="fa-solid fa-check-double"></i>', `${selesai} Pemesanan`, 'Total Pemesanan Selesai', 'Total Pemesanan', `${orders.length} Pemesanan`) +
    sc(badge, `${verif} Pemesanan`, 'Total Pemesanan Pembayaran Diverifikasi', 'Pesanan Menunggu Pembayaran', `${menunggu} Pemesanan`) +
    sc('<i class="fa-regular fa-calendar-check"></i>', `${hariIni} Pemesanan`, 'Total Pemesanan Hari Ini', 'Total Pemesanan Minggu Ini', `${mingguIni} Pemesanan`);
}

/* ====== FILTER & TABEL ====== */
$('statusF').innerHTML = '<option value="semua">Semua Status</option>' + Object.keys(STATUS).map(s => `<option>${s}</option>`).join('');
$('payF').innerHTML = '<option value="semua">Semua Pembayaran</option>' + Object.keys(BAYAR).map(s => `<option>${s}</option>`).join('');
function setDate(v) { dateStr = v; $('dateText').textContent = v ? v.split('-').reverse().map((x, i) => i === 2 ? x.slice(2) : x).join('/') : 'DD/MM/YY'; $('dateClear').classList.toggle('hidden', !v); page = 1; renderTable(); }
function clearDate() { $('dateF').value = ''; setDate(''); }

const COLS = 'grid grid-cols-[2.4fr_1.2fr_1.1fr_1.7fr_1.5fr_1fr_1fr] items-center gap-2';
function renderHead() {
  const ico = sort === 'za' ? 'fa-arrow-down-z-a' : 'fa-arrow-down-a-z';
  const tip = sort === 'az' ? 'Urutkan Z-A' : 'Urutkan A-Z';
  $('thead').innerHTML = `
    <div class="flex items-center"><button type="button" onclick="cycleSort()" title="${tip}" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white/20 ${sort === 'default' ? '' : 'bg-white/20'}"><i class="fa-solid ${ico}"></i></button><span class="flex-1">Pelanggan</span></div>
    <div>Kode</div><div>Jadwal</div><div>Status</div><div>Pembayaran</div><div>Total</div><div>Aksi</div>`;
}
function cycleSort() { sort = sort === 'az' ? 'za' : 'az'; renderTable(); }   // dua kondisi: A-Z dan Z-A (urutan awal = urutan data)

function filtered() {
  const term = q.trim().toLowerCase(), digits = term.replace(/\D/g, '');
  const isPhone = digits && /^[\d\s+\-()]+$/.test(term);   // hanya angka = cari nomor telepon

  // jika kode diketik lengkap, tampilkan hanya pemesanan dengan kode itu
  const exact = term && orders.filter(o => o.kode.toLowerCase() === term);
  const base = exact && exact.length ? exact : orders.filter(o =>
    !term || o.nama.toLowerCase().includes(term) || o.kode.toLowerCase().includes(term) || (isPhone && o.nomor.includes(digits)));

  const rows = base.filter(o =>
    (stat === 'semua' || o.status === stat) &&
    (pay === 'semua' || o.bayar === pay) &&
    (!dateStr || ymd(o.jadwal) === dateStr));

  if (sort !== 'default') rows.sort((a, b) => a.nama.localeCompare(b.nama, 'id') * (sort === 'az' ? 1 : -1));
  return rows;
}

const pill = (txt, bg) => `<span class="inline-block text-[11px] font-semibold px-3 py-1 rounded-full whitespace-nowrap" style="background:${bg}">${esc(txt)}</span>`;
function row(o) {
  return `<div class="${COLS} bg-white rounded-lg border border-gray-200 shadow-md px-4 py-3 text-center">
    <div class="flex items-center gap-4 min-w-0">
      <span class="w-12 h-12 rounded-full flex items-center justify-center font-semibold text-xl flex-shrink-0" style="background:${AV[o.ci % 3]}">${esc(o.nama.charAt(0).toUpperCase())}</span>
      <div class="min-w-0 flex-1"><div class="font-bold text-sm truncate" title="${esc(o.nama)}">${esc(o.nama)}</div><div class="text-gray-500 font-semibold text-sm">${esc(o.nomor)}</div></div></div>
    <div class="font-bold text-sm">${esc(o.kode)}</div>
    <div><div class="font-bold text-sm">${fmtDate(o.jadwal)}</div><div class="text-[10px] font-semibold">${fmtTime(o.jadwal)}</div></div>
    <div>${pill(o.status, STATUS[o.status] || '#D9D9D9')}</div>
    <div>${pill(o.bayar, BAYAR[o.bayar] || '#C4C4C4')}</div>
    <div class="font-semibold text-sm">${money(o.total)}</div>
    <div><button type="button" onclick="go('detail','${o.id}')" class="bg-[#FFE600] hover:bg-yellow-400 text-sm font-bold px-4 py-1.5 rounded-full shadow inline-flex items-center gap-2"><i class="fa-regular fa-eye"></i> Detail</button></div>
  </div>`;
}
function renderTable() {
  renderHead();
  const all = filtered(), pages = Math.max(1, Math.ceil(all.length / PER));
  page = Math.min(Math.max(page, 1), pages);
  $('rows').innerHTML = all.length ? all.slice((page - 1) * PER, page * PER).map(row).join('')
    : '<p class="text-sm text-gray-500 text-center py-10">Tidak ada pemesanan yang cocok.</p>';
  renderPager(pages);
}
function renderPager(pages) {
  const nav = 'w-9 h-9 rounded-full bg-white text-black border border-gray-200 flex items-center justify-center shadow-md disabled:opacity-40 disabled:cursor-not-allowed';
  let nums = '';
  for (let i = 1; i <= pages; i++)
    nums += `<button type="button" onclick="goPage(${i})" class="w-7 h-7 rounded-full text-sm font-bold ${i === page ? 'bg-[#FFE600]' : ''} text-black">${i}</button>`;
  $('pager').innerHTML = `
    <button type="button" class="${nav}" ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})" title="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="bg-white border border-gray-200 rounded-full px-1.5 py-1 flex items-center gap-1 shadow-md">${nums}</div>
    <button type="button" class="${nav}" ${page >= pages ? 'disabled' : ''} onclick="goPage(${page + 1})" title="Berikutnya"><i class="fa-solid fa-chevron-right"></i></button>`;
}
function goPage(p) { page = p; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ====== SIDEBAR ====== */
const toggleSb = () => document.body.classList.toggle('sb-hidden');
if (window.innerWidth < 1024) document.body.classList.add('sb-hidden');

renderStats(); renderTable();
</script>
