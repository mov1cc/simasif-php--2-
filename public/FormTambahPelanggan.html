<!-- KONTEN -->
<main id="main" class="min-h-screen p-5 sm:p-8">
  <div class="max-w-4xl mx-auto">
    <section class="bg-white rounded-2xl border border-gray-200 shadow-md px-6 py-8 sm:px-14 sm:py-12">
      <div>
        <label for="fNama" class="block text-lg sm:text-xl font-semibold">Nama Pelanggan</label>
        <input id="fNama" type="text" maxlength="100" autocomplete="off" placeholder="Masukkan nama pelanggan" oninput="liveCheck('nama')" onblur="blurCheck('nama')" onkeydown="if(event.key==='Enter')submitForm()" class="mt-3 w-full h-12 bg-[#EEEEEE] border border-gray-300 rounded-lg px-4 text-base focus:outline-none placeholder:text-gray-400">
        <p id="eNama" class="hidden text-sm text-red-600 mt-2"></p>
      </div>
      <div class="mt-6">
        <label for="fNomor" class="block text-lg sm:text-xl font-semibold">Nomor Telepon/ WhatsApp</label>
        <input id="fNomor" type="tel" inputmode="tel" maxlength="16" autocomplete="off" placeholder="Masukkan nomor telepon atau WhatsApp" oninput="liveCheck('nomor')" onblur="blurCheck('nomor')" onkeydown="if(event.key==='Enter')submitForm()" class="mt-3 w-full h-12 bg-[#EEEEEE] border border-gray-300 rounded-lg px-4 text-base focus:outline-none placeholder:text-gray-400">
        <p id="eNomor" class="hidden text-sm text-red-600 mt-2"></p>
      </div>
    </section>

    <div class="mt-8 flex flex-col gap-3">
      <button id="btnSave" type="button" onclick="submitForm()" class="w-full bg-[#FFE600] hover:bg-yellow-400 text-black text-xl font-semibold py-2.5 rounded-xl shadow-md border border-gray-200 disabled:opacity-60">Tambah Pelanggan</button>
      <a href="Pelanggan.html" class="w-full bg-black hover:bg-gray-800 text-white text-xl font-semibold py-2.5 rounded-xl shadow-md text-center">Kembali</a>
    </div>
  </div>
</main>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
const $ = id => document.getElementById(id);
const editId = new URLSearchParams(location.search).get('id');

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}
function showErr(id, msg) {
  const e = $(id), inp = $(id.replace(/^e/, 'f'));
  e.textContent = msg || ''; e.classList.toggle('hidden', !msg);
  inp.style.borderColor = msg ? '#F87171' : ''; inp.style.background = msg ? '#FEF2F2' : '';   // kolom error: tepi merah + latar merah muda
  inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
}
/* ====== ATURAN VALIDASI ====== */
// Nama: wajib, hanya huruf & spasi, minimal 3 karakter
function checkNama(v, full) {
  if (!v) return 'Nama pelanggan wajib diisi.';
  if (!/^[\p{L}\s]+$/u.test(v)) return 'Nama hanya boleh berisi huruf dan spasi.';
  if (full && v.length < 3) return 'Nama minimal 3 karakter.';
  return '';
}
// Nomor: wajib, hanya angka (boleh diawali +62 atau 08), 10-15 digit, tanpa huruf/spasi/simbol lain
function checkNomor(v, full) {
  if (!v) return 'Nomor telepon wajib diisi.';
  if (!/^\+?\d*$/.test(v)) return 'Nomor hanya boleh berisi angka, tanpa huruf, spasi, atau simbol lain.';
  if (full) {
    if (!/^(\+62|08)/.test(v)) return 'Nomor harus diawali +62 atau 08.';
    const d = v.replace('+', '').length;
    if (d < 10 || d > 15) return 'Nomor harus 10-15 digit.';
  }
  return '';
}
const fieldVal = f => $(f === 'nama' ? 'fNama' : 'fNomor').value.trim();
// saat mengetik: cek kosong & karakter terlarang; aturan panjang dicek saat kolom ditinggalkan/disimpan
function liveCheck(f) {
  const v = fieldVal(f);
  showErr(f === 'nama' ? 'eNama' : 'eNomor', (f === 'nama' ? checkNama : checkNomor)(v, false));
}
function blurCheck(f) {
  const v = fieldVal(f);
  if (v) showErr(f === 'nama' ? 'eNama' : 'eNomor', (f === 'nama' ? checkNama : checkNomor)(v, true));
}

async function submitForm() {
  const nama = $('fNama').value.trim().replace(/\s+/g, ' ');
  const nomor = $('fNomor').value.trim();
  const eN = checkNama(nama, true), eT = checkNomor(nomor, true);
  showErr('eNama', eN);
  showErr('eNomor', eT);
  if (eN || eT) return;

  $('btnSave').disabled = true;

  try {
    const url = editId
      ? '/api/pelanggan/' + encodeURIComponent(editId)
      : '/api/pelanggan';

    const res = await fetch(url, {
      method: editId ? 'PUT' : 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ nama, nomor })
    });

    const data = await res.json().catch(() => ({}));

    if (res.status === 422) {
      showErr('eNama', (data.errors || {}).nama);
      showErr('eNomor', (data.errors || {}).nomor);
      $('btnSave').disabled = false;
      return;
    }

    if (!res.ok)
      throw new Error(data.error || ('HTTP ' + res.status));

    toast(editId ? 'Data pelanggan diperbarui.' : 'Pelanggan ditambahkan.');

    setTimeout(() => {
      location.href = 'Pelanggan.html';
    }, 900);

  } catch (err) {
    toast('Gagal menyimpan: ' + err.message);
    $('btnSave').disabled = false;
  }
}

/* ====== SIDEBAR ====== */

const toggleSb = () => {
    const html = document.documentElement;
    const body = document.body;

    html.classList.toggle('sb-hidden');
    body.classList.toggle('sb-hidden');

    const isHidden = html.classList.contains('sb-hidden');

    localStorage.setItem('sidebarHidden', isHidden);
};


// Saat halaman dibuka, ambil kondisi terakhir
document.addEventListener("DOMContentLoaded", () => {

    const isHidden = localStorage.getItem('sidebarHidden');

    if (isHidden === 'true') {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');
    }

    if (window.innerWidth < 1024 && isHidden === null) {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');

        localStorage.setItem('sidebarHidden', 'true');
    }

});

/* ===== MODE EDIT ===== */
(async () => {
  if (editId) {
    document.title = 'SIMASIF - Edit Pelanggan';
    $('btnSave').textContent = 'Simpan Perubahan';
    $('btnSave').disabled = true;

    try {
      const res = await fetch('/api/pelanggan/' + encodeURIComponent(editId));
      const d = (await res.json().catch(() => ({}))).data;

      if (!res.ok || !d)
        throw new Error('Pelanggan tidak ditemukan.');

      if (d.berjalan > 0) {
        toast('Pelanggan masih punya pemesanan yang sedang berjalan.');
        setTimeout(() => {
          location.href = 'Pelanggan.html';
        }, 1500);
        return;
      }

      $('fNama').value = d.nama;
      $('fNomor').value = d.nomor;

      $('btnSave').disabled = false;

    } catch (err) {
      toast('Gagal memuat data pelanggan: ' + err.message);
      return;
    }
  }

  $('fNama').focus();
})();
</script>
</body>
</html>
