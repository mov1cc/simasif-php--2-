    <h1 id="judul-login" class="m-0 text-center text-[32px] font-bold">Login</h1>
    <p class="mt-1 mb-6 text-center text-sm">Khusus Owner dan Pegawai Studio Flamboyan</p>

    <form id="form-login" novalidate>
      <div class="mb-[18px]">
        <label for="email" class="block text-sm mb-1.5">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required aria-describedby="err-email"
               class="w-full h-[38px] px-3 text-sm bg-[#eee] border-2 border-[#d6d6d6] rounded-[10px] focus:outline-none aria-[invalid=true]:border-[#c62828]">
        <p id="err-email" role="alert" class="mt-1 text-xs text-[#c62828]"></p>
      </div>

      <div class="mb-[18px]">
        <label for="password" class="block text-sm mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="err-password"
                 class="w-full h-[38px] pl-3 pr-11 text-sm bg-[#eee] border-2 border-[#d6d6d6] rounded-[10px] focus:outline-none aria-[invalid=true]:border-[#c62828]">
          <button type="button" id="pw-toggle" aria-label="Tampilkan password" aria-pressed="false"
                  class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-md text-[#555] hover:text-black focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1a1a1a]">
            <!-- Mata tertutup: tampil saat password tersembunyi -->
            <svg id="ikon-mata-tutup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" aria-hidden="true">
              <path d="M2.5 10c2.4 4.2 5.9 6.2 9.5 6.2s7.1-2 9.5-6.2"/>
              <path d="M12 16.2v3.3"/>
              <path d="M6.2 14.6l-1.8 2.6"/>
              <path d="M17.8 14.6l1.8 2.6"/>
            </svg>
            <!-- Mata terbuka: tampil saat password terlihat -->
            <svg id="ikon-mata-buka" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden w-5 h-5" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p id="err-password" role="alert" class="mt-1 text-xs text-[#c62828]"></p>
      </div>

      <button type="submit" id="btn-masuk"
              class="w-full h-[38px] mt-2 text-sm font-bold text-black bg-[#ffe100] rounded-lg shadow-[0_2px_4px_rgba(0,0,0,.35)] hover:brightness-95 disabled:opacity-70 disabled:cursor-wait focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1a1a1a]">Masuk</button>
      <p id="status" role="status" aria-live="polite" class="mt-3 text-[13px] text-center"></p>
    </form>

    <a href="LupaPassword.html" class="block mt-4 text-center text-xs text-[#555] no-underline hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1a1a1a]">Lupa Password?</a>
  </section>
</main>

<script>
(function () {
  /* ---------- Menu hamburger ---------- */
  var navToggle = document.getElementById('nav-toggle');
  var menu = document.getElementById('menu');

  function setMenu(buka) {
    menu.classList.toggle('hidden', !buka);
    navToggle.setAttribute('aria-expanded', buka ? 'true' : 'false');
    navToggle.setAttribute('aria-label', buka ? 'Tutup menu' : 'Buka menu');
  }

  navToggle.addEventListener('click', function () {
    setMenu(menu.classList.contains('hidden'));
  });
  menu.addEventListener('click', function (e) {
    if (e.target.closest('a')) setMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.classList.contains('hidden') && navToggle.offsetParent !== null) {
      setMenu(false);
      navToggle.focus();
    }
  });
  window.matchMedia('(min-width: 768px)').addEventListener('change', function (e) {
    if (e.matches) setMenu(false);
  });

  /* ---------- Form login ---------- */
  var form = document.getElementById('form-login');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var errEmail = document.getElementById('err-email');
  var errPassword = document.getElementById('err-password');
  var status = document.getElementById('status');
  var btn = document.getElementById('btn-masuk');
  var toggle = document.getElementById('pw-toggle');
  var ikonTutup = document.getElementById('ikon-mata-tutup');
  var ikonBuka = document.getElementById('ikon-mata-buka');

  var emailPola = /^[A-Za-z0-9._%+\-]+@(?:[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}$/;

  function setError(input, el, pesan) {
    el.textContent = pesan;
    if (pesan) input.setAttribute('aria-invalid', 'true');
    else input.removeAttribute('aria-invalid');
  }

  function cekEmail() {
    var v = email.value.trim();
    if (!v) { setError(email, errEmail, 'Email wajib diisi.'); return false; }
    if (/\s/.test(v)) { setError(email, errEmail, 'Email tidak boleh mengandung spasi.'); return false; }
    if (v.indexOf('@') === -1) { setError(email, errEmail, 'Email harus mengandung tanda @, contoh: nama@studio.com.'); return false; }
    if (v.split('@').length > 2) { setError(email, errEmail, 'Email hanya boleh memiliki satu tanda @.'); return false; }
    if (v.split('@')[0] === '') { setError(email, errEmail, 'Tuliskan nama sebelum tanda @.'); return false; }
    if (/@[^.]*$/.test(v)) { setError(email, errEmail, 'Domain email belum lengkap, contoh: nama@studio.com.'); return false; }
    if (/\.\.|^\.|\.@/.test(v) || !emailPola.test(v)) { setError(email, errEmail, 'Format email belum benar, contoh: nama@studio.com.'); return false; }
    setError(email, errEmail, '');
    return true;
  }

  function cekPassword() {
    if (!password.value) { setError(password, errPassword, 'Password wajib diisi.'); return false; }
    setError(password, errPassword, '');
    return true;
  }

  /* Saat keluar dari kolom, hanya cek jika sudah ada isinya.
     Kolom kosong baru ditandai saat tombol Masuk ditekan. */
  email.addEventListener('blur', function () { if (email.value.trim()) cekEmail(); });
  password.addEventListener('blur', function () { if (password.value) cekPassword(); });
  email.addEventListener('input', function () { if (email.hasAttribute('aria-invalid')) cekEmail(); });
  password.addEventListener('input', function () { if (password.hasAttribute('aria-invalid')) cekPassword(); });

  toggle.addEventListener('click', function () {
    var tampil = password.type === 'password';
    password.type = tampil ? 'text' : 'password';
    ikonTutup.classList.toggle('hidden', tampil);
    ikonBuka.classList.toggle('hidden', !tampil);
    toggle.setAttribute('aria-pressed', tampil ? 'true' : 'false');
    toggle.setAttribute('aria-label', tampil ? 'Sembunyikan password' : 'Tampilkan password');
  });

  function setStatus(pesan, warna) {
    status.textContent = pesan;
    status.className = 'mt-3 text-[13px] text-center ' + (warna || '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    setStatus('');

    var okEmail = cekEmail();
    var okPass = cekPassword();
    if (!okEmail) { email.focus(); return; }
    if (!okPass) { password.focus(); return; }

    btn.disabled = true;
btn.textContent = 'Memproses...';
fetch('/api/auth/login', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email: email.value.trim(), password: password.value })
}).then(function (res) {
  return res.json().catch(function () { return {}; }).then(function (d) { return { res: res, d: d }; });
}).then(function (r) {
  if (r.res.ok) { location.href = 'Dashboard.html'; return; }
  if (r.res.status === 422 && r.d.errors) {
    if (r.d.errors.email) setError(email, errEmail, r.d.errors.email);
    if (r.d.errors.password) setError(password, errPassword, r.d.errors.password);
  } else setStatus(r.d.error || 'Gagal masuk. Coba lagi.', 'text-[#c62828]');
}).catch(function () {
  setStatus('Tidak bisa terhubung ke server.', 'text-[#c62828]');
}).then(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
  });
})();
</script>
</body>
</html>
