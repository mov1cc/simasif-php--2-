<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
/* ====== KONFIGURASI ====== */
const ROUTES = { detail: 'DetailPemesanan.html' };
let OPEN_H = 8, CLOSE_H = 18, MIN_DUR = 15;   // diisi dari /api/jadwal (config)


/* ====== HELPER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => ymd(a) === ymd(b);
const toMin = j => { const [h, m] = j.split(':').map(Number); return h * 60 + m; };
const toJam = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return (h ? h + ' jam' : '') + (h && r ? ' ' : '') + (r ? r + ' menit' : (h ? '' : '0 menit')); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const HARI3 = ['Ming', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BULAN3 = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const PILL = ['#FF8A8A', '#00D100', '#7FA8FF'];   // warna nama bergantian merah, hijau, biru
const STATUS = { 'Pemesanan Dibuat': '#D9D9D9', 'Menunggu Pembayaran': '#FFE033', 'Pembayaran Diverifikasi': '#6A9BFF',
  'Terjadwal': '#F27CF2', 'Sesi Foto': '#FFB27A', 'Proses Editing': '#7BF0FF', 'Hasil Siap': '#B388FF', 'Selesai': '#86F286' };
const BAYAR = { 'Belum Dibayar': '#C4C4C4', 'Menunggu Verifikasi': '#FFE033', 'Lunas': '#8EF08E', 'Ditolak': '#FF8A8A' };
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}
function openDetail(id) { if (!ROUTES.detail) return toast('Halaman detail belum tersambung.'); location.href = ROUTES.detail + '?id=' + encodeURIComponent(id); }

/* ====== DATA (GET /api/jadwal) ====== */
let byDay = {}, loadedKey = '', reqId = 0;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

async function loadMonth(force) {
  const key = monthKey(cursor);
  if (!force && key === loadedKey) return;
  const a = weekStart(new Date(cursor.getFullYear(), cursor.getMonth(), 1)), z = addDays(a, 41);   // grid 6 minggu
  const my = ++reqId;
  try {
    const res = await fetch(`/api/jadwal?dari=${ymd(a)}&sampai=${ymd(z)}`);
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || Object.values(d.errors || {}).join(' ') || 'HTTP ' + res.status);
    if (my !== reqId) return;                      // abaikan respons usang
    ({ buka: OPEN_H, tutup: CLOSE_H, min_durasi: MIN_DUR } = d.config);
    byDay = {};
    d.data.forEach(x => (byDay[x.tgl] = byDay[x.tgl] || []).push(x));
    loadedKey = key;
  } catch (e) { toast('Gagal memuat jadwal: ' + e.message); }
}
const dayList = d => byDay[ymd(d)] || [];
// celah waktu kosong sehari; penuh bila tidak ada celah yang muat untuk layanan tersingkat
function dayInfo(list) {
  const gaps = [], close = CLOSE_H * 60; let cur = OPEN_H * 60;
  list.forEach(b => { if (cur < close && b.mulai > cur) gaps.push({ s: cur, e: Math.min(b.mulai, close) }); cur = Math.max(cur, b.selesai); });
  if (cur < close) gaps.push({ s: cur, e: close });
  return { gaps, free: gaps.reduce((a, g) => a + g.e - g.s, 0), full: !gaps.some(g => g.e - g.s >= MIN_DUR) };
}

/* ====== STATE ====== */
let view = 'bulan', cursor = new Date(TODAY), selected = new Date(TODAY), popYear = cursor.getFullYear();
const qs = new URLSearchParams(location.search).get('tanggal');
if (qs && /^\d{4}-\d{2}-\d{2}$/.test(qs)) { cursor = parseYmd(qs); selected = parseYmd(qs); }

/* ====== STATISTIK (untuk bulan yang sedang dilihat) ====== */
function renderStats() {
  const y = cursor.getFullYear(), m = cursor.getMonth(), n = new Date(y, m + 1, 0).getDate();
  let best = null, bestN = 0, full = 0; const wd = Array(7).fill(0), wdCount = Array(7).fill(0);
  for (let d = 1; d <= n; d++) {
    const dd = new Date(y, m, d), c = dayList(dd).length;
    if (c > bestN) { best = dd; bestN = c; }
    if (dayInfo(dayList(dd)).full) full++;
    wd[dd.getDay()] += c; wdCount[dd.getDay()]++;
  }
  let top = -1; wd.forEach((v, i) => { if (v > 0 && (top < 0 || v > wd[top])) top = i; });
  const avg = top >= 0
  ? Math.round(wd[top] / wdCount[top]).toLocaleString('id-ID')
  : '0';
  const sc = (icon, title, sub, l, r) => `
    <div class="bg-white rounded-xl border-2 border-[#FFE600] shadow-md overflow-hidden flex flex-col">
      <div class="relative p-4 pt-9 flex-1"><i class="${icon} absolute top-3 right-4 text-2xl"></i>
        <div class="text-3xl font-bold leading-tight">${title}</div><div class="text-sm mt-1">${sub}</div></div>
      <div class="bg-[#FFE600] px-4 py-2 flex justify-between gap-2 text-xs font-medium"><span>${l}</span><span class="text-right">${r}</span></div>
    </div>`;
  $('stats').innerHTML =
    sc('fa-solid fa-ranking-star', best ? `${pad(best.getDate())} ${BULAN3[best.getMonth()]} ${best.getFullYear()}` : '-', 'Pemesanan Terbanyak dalam Satu Hari', 'Total Pemesanan', `${bestN} Pemesanan`) +
    sc('fa-solid fa-list-check', `${full} Hari`, 'Total Hari Full dalam Satu Bulan', 'Hari dengan Slot Kosong', `${n - full} Hari`) +
    sc('fa-solid fa-people-group', top >= 0 ? HARI[top] : '-', 'Hari dengan Pelanggan Ramai', 'Rata - Rata Pelanggan', `${avg} Pelanggan`);
}

/* ====== TOOLBAR ====== */
function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }   // minggu mulai Senin
function renderToolbar() {
  $('title').innerHTML = `${BULAN[cursor.getMonth()]} ${cursor.getFullYear()} <i class="fa-solid fa-caret-down text-sm"></i>`;
  $('viewSwitch').innerHTML = [['hari', 'Hari'], ['minggu', 'Minggu'], ['bulan', 'Bulan']].map(([k, l]) =>
    `<button type="button" onclick="setView('${k}')" class="px-3 py-1 rounded ${view === k ? 'bg-[#FFE600]' : 'hover:bg-gray-200'}">${l}</button>`).join('');
  const f = d => `${BULAN3[d.getMonth()]}, ${pad(d.getDate())}, ${d.getFullYear()}`;
  let a = cursor, b = cursor;
  if (view === 'bulan') { a = new Date(cursor.getFullYear(), cursor.getMonth(), 1); b = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0); }
  if (view === 'minggu') { a = weekStart(cursor); b = addDays(a, 6); }
  $('range').textContent = view === 'hari' ? f(a) : `${f(a)} - ${f(b)}`;
}
function setView(v) { view = v; refresh(); }
function shift(dir) {
  if (view === 'bulan') cursor = new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1);
  else cursor = addDays(cursor, dir * (view === 'minggu' ? 7 : 1));
  if (view === 'hari') selected = new Date(cursor);
  refresh();
}
function goToday() { cursor = new Date(TODAY); selected = new Date(TODAY); refresh(); }
function jumpTo(v) { if (!v) return; cursor = parseYmd(v); selected = parseYmd(v); refresh(); }
function pick(s) { selected = parseYmd(s); if (view === 'hari') cursor = new Date(selected); refresh(); }

/* pilih bulan */
function toggleMonthPop(e) {
  e.stopPropagation();
  const p = $('monthPop');
  if (p.classList.contains('hidden')) { popYear = cursor.getFullYear(); renderMonthPop(); p.classList.remove('hidden'); } else p.classList.add('hidden');
}
function renderMonthPop() {
  $('monthPop').innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <button type="button" onclick="event.stopPropagation(); popYear--; renderMonthPop()" class="w-7 h-7 rounded-full hover:bg-gray-100"><i class="fa-solid fa-chevron-left text-xs"></i></button>
      <span class="font-bold text-sm">${popYear}</span>
      <button type="button" onclick="event.stopPropagation(); popYear++; renderMonthPop()" class="w-7 h-7 rounded-full hover:bg-gray-100"><i class="fa-solid fa-chevron-right text-xs"></i></button></div>
    <div class="grid grid-cols-3 gap-1.5">${BULAN3.map((b, i) => `<button type="button" onclick="setMonth(${popYear},${i})" class="text-xs font-semibold py-1.5 rounded-md ${(cursor.getFullYear() === popYear && cursor.getMonth() === i) ? 'bg-[#FFE600]' : 'hover:bg-gray-100'}">${b}</button>`).join('')}</div>`;
}
function setMonth(y, m) { cursor = new Date(y, m, 1); $('monthPop').classList.add('hidden'); refresh(); }
document.addEventListener('click', e => { if (!$('monthPop').contains(e.target)) $('monthPop').classList.add('hidden'); });

/* ====== TAMPILAN KALENDER ====== */
function renderMonth() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const start = weekStart(new Date(y, m, 1)), end = new Date(y, m + 1, 0), rows = Math.ceil(((end - start) / 86400000 + 1) / 7);
  // hari paling ramai dalam bulan ditandai garis merah
  let best = null, bestN = 0;
  for (let d = 1; d <= end.getDate(); d++) { const c = dayList(new Date(y, m, d)).length; if (c > bestN) { best = ymd(new Date(y, m, d)); bestN = c; } }
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i), key = ymd(d), inM = d.getMonth() === m, list = dayList(d);
    const isToday = sameDay(d, TODAY), isSel = sameDay(d, selected), isBest = key === best && bestN > 0;
    const border = isBest ? 'border-2 border-red-600' : isSel ? 'border-2 border-[#3478FF]' : 'border-2 border-transparent';
    const shown = list.slice(0, 4);
    cells += `<div role="button" tabindex="0" onclick="pick('${key}')" onkeydown="if(event.key==='Enter')pick('${key}')" class="min-h-[7.5rem] rounded-lg p-2 cursor-pointer ${border} ${inM ? 'bg-[#E6ECFF]' : 'bg-[#F1F5FF] text-gray-400'} hover:brightness-95">
      <div class="flex justify-between items-start text-[11px]"><span class="${inM ? '' : 'text-gray-400'}">${HARI3[d.getDay()]}</span>
        <span class="font-bold ${isToday ? 'bg-[#0A4DFF] text-white rounded-full px-1.5' : ''}">${pad(d.getDate())}</span></div>
      <div class="mt-1.5 flex flex-col gap-1 ${inM ? '' : 'opacity-60'}">
        ${shown.map((b, j) => `<span class="block truncate text-[11px] font-semibold text-black rounded-[5px] px-2.5 py-[3px] text-left" style="background:${PILL[j % 3]}" title="${esc(b.jam)}-${esc(b.akhir)} ${esc(b.nama)}">${esc(b.nama)}</span>`).join('')}
        ${list.length > 4 ? `<span class="self-start text-[10px] font-semibold bg-gray-300 text-black rounded-full px-2 py-0.5">+ ${list.length - 4}</span>` : ''}
      </div></div>`;
  }
  $('cal').innerHTML = `<div class="grid grid-cols-7 gap-2">${cells}</div>`;
}
function renderWeek() {
  const s = weekStart(cursor);
  $('cal').innerHTML = `<div class="grid grid-cols-7 gap-2">${[0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(s, i), key = ymd(d), list = dayList(d), isSel = sameDay(d, selected), isToday = sameDay(d, TODAY);
    return `<div role="button" tabindex="0" onclick="pick('${key}')" onkeydown="if(event.key==='Enter')pick('${key}')" class="min-h-[22rem] rounded-lg p-2 cursor-pointer bg-[#E6ECFF] border-2 ${isSel ? 'border-[#3478FF]' : 'border-transparent'} hover:brightness-95">
      <div class="flex justify-between items-start text-[11px]"><span>${HARI3[d.getDay()]}</span><span class="font-bold ${isToday ? 'bg-[#0A4DFF] text-white rounded-full px-1.5' : ''}">${pad(d.getDate())}</span></div>
      <div class="mt-2 flex flex-col gap-1">${list.map((b, j) => `<span class="block text-[10px] font-semibold text-black rounded-md px-2 py-1" style="background:${PILL[j % 3]}"><span class="font-bold">${b.jam}</span> ${esc(b.nama)}</span>`).join('') || '<span class="text-[10px] text-gray-500 text-center mt-4">Kosong</span>'}</div></div>`;
  }).join('')}</div>`;
}
function renderDay() {
  const list = dayList(cursor), info = dayInfo(list), rows = []; let cur = OPEN_H * 60;
  const gap = (s, e) => `<div class="flex items-center gap-3 text-xs"><span class="w-24 font-semibold text-gray-600">${toJam(s)}-${toJam(e)}</span><div class="flex-1 rounded-md px-3 py-2 border border-dashed border-gray-400 text-gray-500">Slot kosong <span class="text-gray-400">(${fmtDur(e - s)})</span></div></div>`;
  list.forEach(b => {
    if (cur < CLOSE_H * 60 && b.mulai > cur) rows.push(gap(cur, Math.min(b.mulai, CLOSE_H * 60)));
    rows.push(`<div class="flex items-center gap-3 text-xs"><span class="w-24 font-semibold text-gray-600">${b.jam}-${b.akhir}</span>
      <div class="flex-1 flex items-center justify-between gap-2 flex-wrap rounded-md px-3 py-2 bg-white shadow border border-gray-200"><span class="font-semibold truncate">${esc(b.nama)}</span><span class="text-gray-600">${esc(b.layanan)} (${b.durasi} mnt)</span><span class="text-gray-600">${esc(b.kode)}</span>${badges(b)}</div></div>`);
    cur = Math.max(cur, b.selesai);
  });
  if (cur < CLOSE_H * 60) rows.push(gap(cur, CLOSE_H * 60));
  $('cal').innerHTML = `<div class="bg-[#E6ECFF] rounded-lg p-3">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><div class="text-sm font-bold">${HARI[cursor.getDay()]}, ${pad(cursor.getDate())} ${BULAN[cursor.getMonth()]} ${cursor.getFullYear()}</div>
      <div class="text-xs ${info.full ? 'text-red-600 font-semibold' : 'text-gray-600'}">${info.full ? 'Hari Penuh' : `Sisa waktu kosong ${fmtDur(info.free)}`}</div></div>
    <div class="flex flex-col gap-1.5">${rows.join('')}</div></div>`;
}
const badges = b => `<span class="flex gap-1"><span class="text-[10px] font-semibold rounded px-2 py-0.5" style="background:${STATUS[b.status] || '#D9D9D9'}">${esc(b.status)}</span><span class="text-[10px] font-semibold rounded px-2 py-0.5" style="background:${BAYAR[b.bayar] || '#C4C4C4'}">${esc(b.bayar)}</span></span>`;

/* ====== PANEL HARI TERPILIH ====== */
function renderPanel() {
  const list = dayList(selected), isToday = sameDay(selected, TODAY), info = dayInfo(list), full = info.full;
  $('panel').innerHTML = `
    <div class="flex items-start justify-between gap-2"><div class="font-bold text-base">${selected.getDate()} ${BULAN[selected.getMonth()]} ${selected.getFullYear()}</div>${isToday ? '<span class="text-sm font-semibold text-gray-500">Hari Ini</span>' : ''}</div>
    <div class="text-xs ${full ? 'text-red-600' : 'text-[#0A22FF]'}">${full ? 'Hari Penuh, tidak ada slot kosong' : `Terdapat Slot Kosong (sisa ${fmtDur(info.free)})`}</div>
    <div class="text-xs mt-2.5">${list.length} Pemesanan</div>
    <div class="mt-2 flex flex-col gap-2 max-h-[32rem] overflow-y-auto pr-0.5">${list.length ? list.map((b, i) => `
      <div class="rounded-lg border border-gray-200 shadow-md p-3 bg-white">
        <div class="flex items-start gap-3">
          <span class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-base flex-shrink-0" style="background:${PILL[i % 3]}">${esc(b.nama.charAt(0).toUpperCase())}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2"><span class="font-semibold text-sm truncate" title="${esc(b.nama)}">${esc(b.nama)}</span>
              <button type="button" onclick="openDetail('${b.id}')" title="Lihat detail" class="text-sm hover:opacity-60 flex-shrink-0"><i class="fa-regular fa-eye"></i></button></div>
            <div class="text-xs text-gray-700 mt-0.5">${esc(b.layanan)} <span class="text-gray-500">(${b.durasi} menit)</span></div>
            <div class="flex flex-wrap items-center gap-x-2 text-xs text-gray-700"><span class="font-medium">${esc(b.kode)}</span><span class="text-gray-400">•</span><span>${b.jam}-${b.akhir} WIB</span></div>
            <div class="mt-2">${badges(b)}</div></div></div></div>`).join('')
      : '<div class="text-xs text-gray-500 py-4 text-center border border-dashed border-gray-300 rounded-lg">Belum ada pemesanan pada hari ini.</div>'}</div>`;
}

function paint() {
  renderToolbar(); renderStats();
  if (view === 'bulan') renderMonth(); else if (view === 'minggu') renderWeek(); else renderDay();
  renderPanel();
}
async function refresh() { renderToolbar(); await loadMonth(); paint(); }
window.addEventListener('focus', async () => { await loadMonth(true); paint(); });   // data terbaru saat kembali ke tab

/* ====== LEBAR PANEL (bisa diseret) ====== */
const PW_DEFAULT = 280, PW_MIN = 224, PW_MAX = 560, PW_KEY = 'simasif_jadwal_panel_w';
const split = $('split'), resizer = $('resizer');
const curPW = () => parseFloat(split.style.getPropertyValue('--pw')) || PW_DEFAULT;
function setPW(w, save) {
  const maxByLayout = split.clientWidth - 24 - 480;   // sisakan minimal 480px untuk kalender
  w = Math.round(Math.max(PW_MIN, Math.min(PW_MAX, maxByLayout, w)));
  split.style.setProperty('--pw', w + 'px');
  if (save) { try { localStorage.setItem(PW_KEY, String(w)); } catch (e) {} }
}
try { const s = parseFloat(localStorage.getItem(PW_KEY)); if (s) split.style.setProperty('--pw', s + 'px'); } catch (e) {}
let rz = null;
resizer.addEventListener('pointerdown', e => { rz = { x: e.clientX, w: curPW() }; resizer.setPointerCapture(e.pointerId); e.preventDefault(); });
resizer.addEventListener('pointermove', e => { if (rz) setPW(rz.w + (rz.x - e.clientX), false); });
['pointerup', 'pointercancel'].forEach(ev => resizer.addEventListener(ev, () => { if (rz) { rz = null; setPW(curPW(), true); } }));
resizer.addEventListener('dblclick', () => setPW(PW_DEFAULT, true));
resizer.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { setPW(curPW() + 16, true); e.preventDefault(); }
  if (e.key === 'ArrowRight') { setPW(curPW() - 16, true); e.preventDefault(); }
});
window.addEventListener('resize', () => setPW(curPW(), false));

/* ====== SIDEBAR ====== */

const toggleSb = () => {
    const html = document.documentElement;
    const body = document.body;

    html.classList.toggle('sb-hidden');
    body.classList.toggle('sb-hidden');

    const isHidden = html.classList.contains('sb-hidden');

    localStorage.setItem('sidebarHidden', isHidden);
};


// Saat halaman dibuka, ambil kondisi terakhir
document.addEventListener("DOMContentLoaded", () => {

    const isHidden = localStorage.getItem('sidebarHidden');

    if (isHidden === 'true') {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');
    }

    if (window.innerWidth < 1024 && isHidden === null) {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');

        localStorage.setItem('sidebarHidden', 'true');
    }

});

refresh();
</script>
