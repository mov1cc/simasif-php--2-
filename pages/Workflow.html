<!-- KONTEN -->
<main id="main" class="min-h-screen p-5 sm:p-8">
  <h1 class="text-2xl sm:text-3xl font-bold">Workflow Pemesanan Pelanggan</h1>
  <p class="text-sm sm:text-base text-gray-800 mt-1">Semua Alur Pemesanan Pelanggan Studio</p>

  <section id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6"></section>

  <section class="mt-7 overflow-x-auto pb-4">
    <div id="board" class="flex items-start gap-4 min-w-max"></div>
  </section>
</main>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
/* ====== KONFIGURASI ====== */
// Isi rute halaman detail pemesanan (menerima ?id=). Kosong = tampil pesan "belum tersambung".
const ROUTES = { detail: 'DetailPemesanan.html' };

/* ====== TAHAPAN ====== */
// [status, warna judul kolom, warna latar kolom, teks judul]
const FLOW = [
  ['Pemesanan Dibuat', '#5C5C5C', '#D6D6D6', '#fff'],
  ['Menunggu Pembayaran', '#F7DE3F', '#FDF3B0', '#000'],
  ['Pembayaran Diverifikasi', '#5B8CFF', '#C9D8FF', '#000'],
  ['Terjadwal', '#F27CF2', '#FBD0FB', '#000'],
  ['Sesi Foto', '#FFB27A', '#FFE2CC', '#000'],
  ['Proses Editing', '#7BF0FF', '#D5FBFF', '#000'],
  ['Hasil Siap', '#B388FF', '#E0D0FF', '#000'],
  ['Selesai', '#86F286', '#D5FBD5', '#000']
];
const STATUSES = FLOW.map(f => f[0]);
const BAYAR = { 'Belum Dibayar': '#C4C4C4', 'Menunggu Verifikasi': '#FFE033', 'Lunas': '#8EF08E', 'Ditolak': '#FF8A8A' };

let orders = [];
async function loadBoard() {
  try {
    const res = await fetch('/api/workflow'), d = await res.json();
    if (!res.ok) throw new Error(d.error || 'HTTP ' + res.status);
    orders = d.columns.flatMap(c => c.items).map(o => ({ ...o, jadwal: new Date(o.jadwal) }));
  } catch (e) { toast('Gagal memuat workflow: ' + e.message); }
  refresh();
}

/* ====== HELPER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => String(n).padStart(2, '0');
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const fmtJadwal = d => `${HARI[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())} WIB`;
const count = s => orders.filter(o => o.status === s).length;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}
function openDetail(id) { if (!ROUTES.detail) return toast('Halaman detail belum tersambung.'); location.href = ROUTES.detail + '?id=' + encodeURIComponent(id); }

/* ====== STATISTIK ====== */
function renderStats() {
  const sc = (icon, title, sub, l, r) => `
    <div class="bg-white rounded-xl border-2 border-[#FFE600] shadow-md overflow-hidden flex flex-col">
      <div class="relative p-4 pt-9 flex-1"><i class="${icon} absolute top-3 right-4 text-2xl"></i>
        <div class="text-3xl font-bold leading-tight">${title}</div><div class="text-sm mt-1">${sub}</div></div>
      <div class="bg-[#FFE600] px-4 py-2 flex justify-between gap-2 text-xs font-medium"><span>${l}</span><span class="text-right">${r}</span></div>
    </div>`;
  $('stats').innerHTML =
    sc('fa-solid fa-cart-plus', `${count('Pemesanan Dibuat')} Pemesanan`, 'Total Pemesanan Dibuat', 'Keseluruhan Pemesanan', `${orders.length} Pemesanan`) +
    sc('fa-solid fa-camera', `${count('Sesi Foto')} Pemesanan`, 'Total Pemesanan Sesi Foto', 'Pemesanan Terjadwal', `${count('Terjadwal')} Pemesanan`) +
    sc('fa-solid fa-images', `${count('Hasil Siap')} Pemesanan`, 'Total Pemesanan Hasil Siap', 'Pemesanan Proses Editing', `${count('Proses Editing')} Pemesanan`);
}

/* ====== PAPAN ALUR ====== */
function card(o) {
  const next = STATUSES[STATUSES.indexOf(o.status) + 1];
  return `<div class="bg-white rounded-xl shadow-md p-4">
    <button type="button" onclick="openDetail('${o.id}')" title="Lihat detail pemesanan" class="font-bold text-base leading-tight hover:underline text-left">${esc(o.kode)}</button>
    <div class="text-sm font-semibold mt-1.5 truncate" title="${esc(o.nama)}">${esc(o.nama)}</div>
    <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1 text-xs"><span>${esc(o.layanan)}</span>
      <span class="font-semibold rounded px-1.5 py-0.5 text-[10px]" style="background:${BAYAR[o.bayar] || '#C4C4C4'}">${esc(o.bayar)}</span></div>
    <div class="text-[11px] mt-1.5 text-gray-800">${fmtJadwal(o.jadwal)}</div>
    ${next
      ? `<button type="button" onclick="advance('${o.id}')" class="mt-3 w-full bg-black hover:bg-gray-800 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap">Lanjut ke ${esc(next)}</button>`
      : '<div class="mt-3 flex items-center justify-center gap-2 text-xs font-medium"><i class="fa-solid fa-check-double text-green-600"></i> Pemesanan Selesai</div>'}
  </div>`;
}
function renderBoard() {
  $('board').innerHTML = FLOW.map(([s, head, bg, fg]) => {
    const list = orders.filter(o => o.status === s);
    return `<div class="w-[19.5rem] flex-shrink-0 rounded-xl shadow-md overflow-hidden flex flex-col" style="background:${bg}">
      <div class="px-3 py-3 text-center text-sm font-semibold" style="background:${head};color:${fg}">${s}</div>
      <div class="p-3 flex flex-col gap-3 min-h-[6rem]">${list.length ? list.map(card).join('') : '<div class="text-[11px] text-gray-500 text-center py-6">Belum ada pemesanan</div>'}</div></div>`;
  }).join('');
}

/* ====== AKSI ====== */
async function advance(id) {
  const o = orders.find(x => x.id === id); if (!o) return;
  const next = STATUSES[STATUSES.indexOf(o.status) + 1]; if (!next) return;
  try {
    const res = await fetch(`/api/pemesanan/${encodeURIComponent(id)}/status`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dari: o.status, status: next })
    });
    const d = await res.json().catch(() => ({}));
    if (res.status === 409) { toast(d.error || 'Status sudah berubah.'); return loadBoard(); }
    if (!res.ok) throw new Error(d.error || Object.values(d.errors || {}).join(' ') || 'HTTP ' + res.status);
    toast(`${o.nama}: lanjut ke ${next}.`);
    await loadBoard();
  } catch (e) { toast('Gagal mengubah status: ' + e.message); }
}

function refresh() { renderStats(); renderBoard(); }

/* ====== SIDEBAR ====== */

const toggleSb = () => {
    const html = document.documentElement;
    const body = document.body;

    html.classList.toggle('sb-hidden');
    body.classList.toggle('sb-hidden');

    const isHidden = html.classList.contains('sb-hidden');

    localStorage.setItem('sidebarHidden', isHidden);
};


// Saat halaman dibuka, ambil kondisi terakhir
document.addEventListener("DOMContentLoaded", () => {

    const isHidden = localStorage.getItem('sidebarHidden');

    if (isHidden === 'true') {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');
    }

    if (window.innerWidth < 1024 && isHidden === null) {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');

        localStorage.setItem('sidebarHidden', 'true');
    }

});

loadBoard();
</script>
<script src="/js/user.js"></script>
</body>
</html>
