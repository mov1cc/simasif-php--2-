<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
/* ====== KONFIGURASI ====== */
const ROUTES = {fotografi: 'FileFoto.html' };

function openJadwal() {
  const d = order.jadwal;
  const tgl = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  location.href = 'Jadwal.html?tanggal=' + tgl;
}
/* ====== DATA CONTOH (ganti dengan GET /api/pemesanan/:id) ====== */

const FLOW = ['Pemesanan Dibuat', 'Menunggu Pembayaran', 'Pembayaran Diverifikasi', 'Terjadwal', 'Sesi Foto', 'Proses Editing', 'Hasil Siap', 'Selesai'];

/* ====== HELPER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => String(n).padStart(2, '0');
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtClock = d => `${pad(d.getHours())}:${pad(d.getMinutes())} WIB`;
const fmtDT = d => `${fmtDate(d)}, ${fmtClock(d)}`;
const money = n => 'Rp' + Number(n).toLocaleString('id-ID');
const AV = ['#7FA8FF', '#FF8A8A', '#00C800'];
const STATUS = { 'Pemesanan Dibuat': '#D9D9D9', 'Menunggu Pembayaran': '#FFE033', 'Pembayaran Diverifikasi': '#6A9BFF', 'Terjadwal': '#F27CF2', 'Sesi Foto': '#FFB27A', 'Proses Editing': '#7BF0FF', 'Hasil Siap': '#B388FF', 'Selesai': '#86F286' };
const PASTEL = { 'Pemesanan Dibuat': '#F2F2F2', 'Menunggu Pembayaran': '#FDEC9A', 'Pembayaran Diverifikasi': '#B3C9FF', 'Terjadwal': '#FBC4FB', 'Sesi Foto': '#FFDDBF', 'Proses Editing': '#C4F8FF', 'Hasil Siap': '#DDCCFF', 'Selesai': '#C8F8C8' };
const BAYAR = { 'Belum Dibayar': '#C4C4C4', 'Menunggu Verifikasi': '#FFE033', 'Lunas': '#8EF08E', 'Ditolak': '#FF8A8A' };
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400);
}
function go(key) { if (!ROUTES[key]) return toast('Halaman ini belum tersambung.'); location.href = ROUTES[key] + '?id=' + encodeURIComponent(order.id); }
const totalHarga = o => o.hargaLayanan + o.addons.reduce((a, x) => a + x.harga * (x.qty || 1), 0);
let order = null;
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0);
const toOrder = d => ({
  ...d, ci: hue(d.id), hargaLayanan: d.harga_layanan,
  catatan: d.catatan_khusus || 'Tidak ada catatan.',
  outputPilihan: d.output_pilihan.length ? d.output_pilihan.map(x => x.pilihan).join(', ') : '-',
  jadwal: new Date(d.jadwal), dibuat: new Date(d.dibuat),
  history: d.history.map(h => ({ ...h, waktu: new Date(h.waktu) }))
});

/* ====== TAMPILAN ====== */
const card = (title, body) => `<div class="bg-white rounded-xl border border-gray-200 shadow-md overflow-hidden">
  <div class="bg-[#3478FF] text-white text-sm font-semibold px-4 py-2.5">${title}</div><div class="p-4 sm:p-5">${body}</div></div>`;
const kv = (k, v, extra = '') => `<div class="flex gap-3 bg-[#F5F5F5] rounded-md px-3 py-2 text-sm"><div class="w-36 sm:w-48 flex-shrink-0 font-semibold">${k}</div><div class="flex-1 min-w-0 ${extra}">${v}</div></div>`;
const pill = (txt, bg) => `<span class="inline-block text-xs font-semibold px-5 py-1.5 rounded-full whitespace-nowrap" style="background:${bg}">${esc(txt)}</span>`;

function render() {
  const o = order, nextI = FLOW.indexOf(o.status) + 1, next = FLOW[nextI];
  $('kode').textContent = o.kode;
  $('badges').innerHTML = pill(o.status, STATUS[o.status]) + pill(o.bayar, BAYAR[o.bayar]);

  $('cInfo').innerHTML = card('Informasi Pemesanan Pelanggan', `
    <div class="flex flex-col items-center text-center">
      <div class="w-28 h-28 rounded-full flex items-center justify-center text-6xl font-bold" style="background:${AV[o.ci % 3]}">${esc(o.nama.charAt(0).toUpperCase())}</div>
      <div class="mt-4 text-xl font-bold">${esc(o.nama)}</div><div class="text-sm font-bold mt-1">${esc(o.nomor)}</div></div>
    <div class="flex flex-col gap-2 mt-5">
      ${kv('Layanan', esc(o.layanan))}
      ${kv('Jadwal', `${HARI[o.jadwal.getDay()]}, ${fmtDT(o.jadwal)}`)}
      ${kv('Estimasi Durasi', esc(o.durasi))}
      ${kv('Pegawai Penanganan', esc(o.pegawai))}
      ${kv('Catatan Khusus', esc(o.catatan), 'text-justify')}
      ${kv('Dibuat Pada', fmtDT(o.dibuat))}
    </div>`);

  $('cHarga').innerHTML = card('Informasi Harga Dasar Pemesanan', `<div class="flex flex-col gap-2">
    ${kv('Harga Layanan', money(o.hargaLayanan))}
    ${kv('Output (Include)', o.output.map(x => `<div>${esc(x)}</div>`).join(''))}
    ${kv('Output Pilihan', esc(o.outputPilihan))}</div>`);

  $('cAddon').innerHTML = card('Informasi Harga Add On Pemesanan', `<div class="flex flex-col gap-2">${
    o.addons.length ? o.addons.map(a => `<div class="grid grid-cols-[9rem_1fr_3rem] sm:grid-cols-[12rem_1fr_3rem] gap-3 bg-[#F5F5F5] rounded-md px-3 py-2 text-sm">
      <div class="font-semibold">${esc(a.nama)}</div><div>${money(a.harga)}</div><div class="text-right">${a.qty ? `(${a.qty})` : ''}</div></div>`).join('')
    : '<div class="bg-[#F5F5F5] rounded-md px-3 py-2 text-sm text-gray-600">Tidak ada add on.</div>'}</div>`);

  $('cTotal').innerHTML = card('Harga Keseluruhan', `<div class="flex justify-between gap-3 bg-[#F5F5F5] rounded-md px-3 py-2 text-sm font-bold"><span>TOTAL HARGA</span><span>${money(totalHarga(o))}</span></div>`);

  const mini = (k, v) => `<div class="flex justify-between gap-3 bg-[#F5F5F5] rounded-md px-3 py-1.5 text-[11px]"><span>${k}</span><span>${esc(v)}</span></div>`;
  $('cStatus').innerHTML = next ? card('Ubah Status Pemesanan', `
    <div class="flex flex-col gap-1.5">${mini('Status Saat Ini', o.status)}${mini('Status Berikutnya', next)}</div>
    <label for="catatan" class="block text-sm font-semibold mt-4">Catatan <span class="font-normal text-gray-500">(opsional)</span></label>
    <textarea id="catatan" rows="4" oninput="liveCatatan()" class="mt-1.5 w-full bg-[#EEEEEE] border border-gray-300 rounded-lg p-3 text-sm focus:outline-none resize-y min-h-[6rem] max-h-96"></textarea>
    <div class="flex justify-between gap-3 mt-1">
      <p id="eCatatan" class="hidden text-xs text-red-600"></p>
      <span id="cCatatan" class="ml-auto text-[10px] text-gray-500">0/255</span>
    </div>
    <button type="button" onclick="advance()" class="mt-3 w-full bg-black hover:bg-gray-800 text-white text-xs font-bold py-2.5 rounded-lg">Lanjut ke ${esc(next)}</button>`)
  : card('Ubah Status Pemesanan', `<div class="flex items-center justify-between gap-3 bg-[#F5F5F5] rounded-full px-3 py-1.5 text-[11px]"><span>Pemesanan Telah Selesai</span><i class="fa-solid fa-circle-check text-green-500 text-sm"></i></div>`);

  $('cRiwayat').innerHTML = card('Riwayat Status Pemesanan', `<div class="relative pl-6 py-1">
    <div class="absolute left-1 top-1 bottom-1 w-1 rounded bg-gray-700"></div>
    ${[...o.history].reverse().map(h => `<div class="rounded-lg px-3 py-2.5 mb-3 last:mb-0 text-[13px] leading-snug" style="background:${PASTEL[h.status] || '#F2F2F2'}">
      <div class="font-bold">${esc(h.status)}</div>
      <div class="text-gray-700">${fmtDT(h.waktu)}, ${esc(h.aktor)}</div>
      <div class="font-semibold">${esc(h.teks)}</div>
      ${h.catatan ? `<div class="mt-1 text-gray-700 italic">Catatan: ${esc(h.catatan)}</div>` : ''}</div>`).join('')}</div>`);
}

/* ====== VALIDASI CATATAN (opsional) ====== */
// Maks. 255 karakter, hanya spasi = kosong, tanpa HTML/script, tanpa emoji (ASCII saja).
// Diizinkan: A-Z a-z 0-9, spasi, . , : ; ! ? ( ) - _ / ' "
const MAX_CATATAN = 255;
function checkCatatan(v) {
  const t = v.trim();
  if (!t) return '';   // kosong / hanya spasi = tidak mengisi catatan
  if (t.length > MAX_CATATAN) return `Catatan maksimal ${MAX_CATATAN} karakter.`;
  if (/[<>]/.test(t)) return 'Catatan tidak boleh mengandung HTML atau script.';
  if (/[\r\n]/.test(t)) return 'Catatan tidak boleh berisi baris baru.';
  if (/[^\x00-\x7F]/.test(t)) return 'Catatan hanya boleh berisi karakter ASCII (tanpa emoji).';
  if (!/^[A-Za-z0-9 .,:;!?()\-_\/'"]+$/.test(t)) return 'Catatan hanya boleh berisi huruf, angka, spasi, dan tanda . , : ; ! ? ( ) - _ / \' "';
  return '';
}
function showCatatan(err) {
  const ta = $('catatan'), e = $('eCatatan');
  e.textContent = err || ''; e.classList.toggle('hidden', !err);
  ta.style.borderColor = err ? '#F87171' : ''; ta.style.background = err ? '#FEF2F2' : '';
  ta.setAttribute('aria-invalid', err ? 'true' : 'false');
}
function liveCatatan() {
  const v = $('catatan').value.trim(), c = $('cCatatan');
  c.textContent = `${v.length}/${MAX_CATATAN}`; c.classList.toggle('text-red-600', v.length > MAX_CATATAN); c.classList.toggle('text-gray-500', v.length <= MAX_CATATAN);
  showCatatan(checkCatatan(v));
}

async function advance() {
  const o = order, next = FLOW[FLOW.indexOf(o.status) + 1];
  if (!next) return;
  const err = checkCatatan($('catatan').value);
  showCatatan(err);
  if (err) { $('catatan').focus(); return; }
  const cat = $('catatan').value.trim();
  try {
    const res = await fetch(`/api/pemesanan/${encodeURIComponent(o.id)}/status`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dari: o.status, status: next, catatan: cat || null })
    });
    const d = await res.json().catch(() => ({}));
    if (res.status === 422) return showCatatan(Object.values(d.errors || {}).join(' '));
    if (!res.ok) throw new Error(d.error || 'HTTP ' + res.status);
    order = toOrder(d.data); render(); toast(`Status diubah ke ${next}.`);
  } catch (e) { toast('Gagal mengubah status: ' + e.message); }
}
function openWA() {
  const d = order.nomor.replace(/\D/g, ''), intl = d.startsWith('62') ? d : '62' + d.replace(/^0/, '');
  const msg = `Halo ${order.nama}, kami dari SIMASIF terkait pemesanan ${order.kode}.`;
  window.open(`https://wa.me/${intl}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

/* ====== SIDEBAR ====== */

const toggleSb = () => {
    const html = document.documentElement;
    const body = document.body;

    html.classList.toggle('sb-hidden');
    body.classList.toggle('sb-hidden');

    const isHidden = html.classList.contains('sb-hidden');

    localStorage.setItem('sidebarHidden', isHidden);
};


// Saat halaman dibuka, ambil kondisi terakhir
document.addEventListener("DOMContentLoaded", () => {

    const isHidden = localStorage.getItem('sidebarHidden');

    if (isHidden === 'true') {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');
    }

    if (window.innerWidth < 1024 && isHidden === null) {
        document.documentElement.classList.add('sb-hidden');
        document.body.classList.add('sb-hidden');

        localStorage.setItem('sidebarHidden', 'true');
    }

});

(async () => {
  const id = new URLSearchParams(location.search).get('id');
  try {
    if (!id) throw 0;
    const res = await fetch('/api/pemesanan/' + encodeURIComponent(id));
    if (!res.ok) throw 0;
    order = toOrder((await res.json()).data); render();
  } catch (_) { $('page').classList.add('hidden'); $('notfound').classList.remove('hidden'); }
})();
</script>
